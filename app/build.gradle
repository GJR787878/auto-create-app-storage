plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.autocreateappstorage'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.gjr787878.autocreateappstorage"
        minSdk 31
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Xposed API – only needed at compile time, provided by LSPosed at runtime
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
