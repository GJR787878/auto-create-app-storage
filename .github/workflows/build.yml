name: Build APK + Magisk Module

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace
          echo "=== APK files ==="
          find . -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Normalize line endings and permissions
        run: |
          sudo apt-get install -y -qq dos2unix
          find . -name "*.sh" -exec dos2unix {} \;
          chmod 0755 service.d/auto_storage_fix.sh

      - name: Pack Magisk module zip
        run: |
          zip -r auto-create-app-storage.zip module.prop service.d/
          echo "=== zip contents ==="
          unzip -l auto-create-app-storage.zip

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Magisk module artifact
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: auto-create-app-storage.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            auto-create-app-storage.zip
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
